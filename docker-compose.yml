services:
  postgres:
    image: postgres:17-alpine

    container_name: unisos-postgres

    restart: unless-stopped

    environment:
      POSTGRES_USER: unisos
      POSTGRES_PASSWORD: uni12345
      POSTGRES_DB: unisos

    ports:
      - "${POSTGRES_PORT}:5432"

    volumes:
      - unisos_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d postgres"
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine

    container_name: unisos-rabbitmq

    restart: unless-stopped

    environment:
      RABBITMQ_DEFAULT_USER: unisos
      RABBITMQ_DEFAULT_PASS: uni12345

    ports:
      - "5672:5672"
      - "15672:15672"

    volumes:
      - unisos_rabbitmq_data:/var/lib/rabbitmq

    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  unisos_postgres_data:
  unisos_rabbitmq_data:
